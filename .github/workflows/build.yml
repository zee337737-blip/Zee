- name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: ${{ env.PROJECT_ROOT }}
        run: grep -E "^e: |error:|What went wrong|Execution failed|Unresolved|AAPT" build.log | head -40
