name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -o seo-hacker-browser.zip -d _project
          SRC=$(dirname "$(find _project -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$SRC" >> $GITHUB_ENV
          if [ ! -f google-services.json ]; then
            echo "::error::google-services.json is missing in the repo root"
            exit 1
          fi
          cp google-services.json "$SRC/app/google-services.json"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SEO-Browser-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
